            - libwebkit2gtk-4.1-0
            - libgtk-3-0
          overrides:
            rpm:
              depends:
                - webkit2gtk4.1
                - gtk3
            archlinux:
              depends:
                - webkit2gtk-4.1
                - gtk3
          contents:
            - src: staging/usr/bin/tnt
              dst: /usr/bin/tnt
              file_info:
                mode: 0755
            - src: staging/usr/share/applications/tnt.desktop
              dst: /usr/share/applications/tnt.desktop
            - src: staging/usr/share/icons/hicolor/256x256/apps/tnt.png
              dst: /usr/share/icons/hicolor/256x256/apps/tnt.png
            - src: staging/usr/bin/ffmpeg
              dst: /usr/bin/ffmpeg
              file_info:
                mode: 0755
          scripts:
            postinstall: postinst
          NFPM_EOF
          cat > postinst << 'POSTINST_EOF'
          #!/bin/bash
          chmod +x /usr/bin/tnt
          update-desktop-database 2>/dev/null || true
          gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
          exit 0
          POSTINST_EOF
          chmod +x postinst

      - name: Build packages
        run: |
          DEB_FILE="${{ steps.meta.outputs.prefix }}tnt_${{ steps.meta.outputs.version }}_arm64.deb"
          nfpm package -p deb -f nfpm.yaml --target "${DEB_FILE}"
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_ENV
          RPM_FILE="${{ steps.meta.outputs.prefix }}tnt-${{ steps.meta.outputs.version }}-1.aarch64.rpm"
          nfpm package -p rpm -f nfpm.yaml --target "${RPM_FILE}"
          echo "RPM_FILE=${RPM_FILE}" >> $GITHUB_ENV
          ARCH_FILE="${{ steps.meta.outputs.prefix }}tnt-${{ steps.meta.outputs.version }}-1-aarch64.pkg.tar.zst"
          nfpm package -p archlinux -f nfpm.yaml --target "${ARCH_FILE}"
          echo "ARCH_FILE=${ARCH_FILE}" >> $GITHUB_ENV

      - name: Build AppImage
        run: |
          curl -Lo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool
          mkdir -p TNT.AppDir/usr/bin TNT.AppDir/usr/share/applications TNT.AppDir/usr/share/icons/hicolor/256x256/apps
          cp tnt-linux-arm64 TNT.AppDir/usr/bin/tnt
          cp go/platform/ffmpegSource/ffmpegLinuxArm64 TNT.AppDir/usr/bin/ffmpeg
          chmod +x TNT.AppDir/usr/bin/tnt TNT.AppDir/usr/bin/ffmpeg
          cp tnt.desktop TNT.AppDir/
          cp Icon.png TNT.AppDir/tnt.png
          cp Icon.png TNT.AppDir/usr/share/icons/hicolor/256x256/apps/tnt.png
          cp tnt.desktop TNT.AppDir/usr/share/applications/
          cat > TNT.AppDir/AppRun << 'APPRUN_EOF'
          #!/bin/bash
          HERE=$(dirname "$(readlink -f "${0}")")
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/tnt" "$@"
          APPRUN_EOF
          chmod +x TNT.AppDir/AppRun
          APPIMAGE_FILE="${{ steps.meta.outputs.prefix }}TNT-aarch64.AppImage"
          ARCH=aarch64 ./appimagetool TNT.AppDir "${APPIMAGE_FILE}"
          echo "APPIMAGE_FILE=${APPIMAGE_FILE}" >> $GITHUB_ENV

      - name: Build tarball
        run: |
          TAR_DIR="tnt-${{ steps.meta.outputs.version }}-linux-arm64"
          mkdir -p "${TAR_DIR}"
          cp tnt-linux-arm64 "${TAR_DIR}/tnt"
          cp go/platform/ffmpegSource/ffmpegLinuxArm64 "${TAR_DIR}/ffmpeg"
          chmod +x "${TAR_DIR}/tnt" "${TAR_DIR}/ffmpeg"
          cp tnt.desktop Icon.png "${TAR_DIR}/"
          TAR_FILE="${{ steps.meta.outputs.prefix }}tnt-${{ steps.meta.outputs.version }}-linux-arm64.tar.gz"
          tar czf "${TAR_FILE}" "${TAR_DIR}"
          echo "TAR_FILE=${TAR_FILE}" >> $GITHUB_ENV

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-assets
          path: |
            ${{ env.DEB_FILE }}
            ${{ env.RPM_FILE }}
            ${{ env.ARCH_FILE }}
            ${{ env.APPIMAGE_FILE }}
            ${{ env.TAR_FILE }}

  release:
    needs:
      - build-linux
      - build-windows
      - build-mac-intel
      - build-mac-arm64
      - build-linux-arm64
    if: always() && !failure() && !cancelled()

    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mac-release-assets/*.dmg
            mac-intel-release-assets/*.dmg
            linux-release-assets/*.deb
            linux-release-assets/*.rpm
            linux-release-assets/*.pkg.tar.zst
            linux-release-assets/*.AppImage
            linux-release-assets/*.tar.gz
            windows-release-assets/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
