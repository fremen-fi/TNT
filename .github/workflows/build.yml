            --password "${{ secrets.NOTARY_PASSWORD }}" \
            --wait
          xcrun stapler staple ${{ steps.filename.outputs.dmg_name }}

      - name: Upload to OVH
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.OVH_ACCESS_KEY }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_SECRET }}
        run: |
            cd go/build/bin
            aws s3 cp "${{ steps.filename.outputs.dmg_name }}" "s3://${{ secrets.OVH_BUCKET }}/mac/intel/tnt.dmg" \
            --endpoint-url "${{ secrets.OVH_ENDPOINT }}" \
            --acl public-read

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-release-assets
