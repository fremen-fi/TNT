name: Release Build

on:
  push:
    tags:
      - 'v*'           # Matches all: v1.3.0, v1.3.0-beta.1, etc.
      - 'v*-alpha.*'   # Explicit alpha releases
      - 'v*-beta.*'    # Explicit beta releases
      - 'v*-rc.*'      # Explicit release candidates

jobs:
  build-mac-arm64:
    if: "(!contains(github.ref, '-win') || contains(github.ref, '-unix') || contains(github.ref, '-macm')) && !contains(github.ref, '-linux')"
    runs-on: [self-hosted, ARM64, macOS, Large]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # No need to set up go in the local runners.
      #- name: Set up Go
      #  uses: actions/setup-go@v4
      #  with:
      #    go-version: '1.26'

      - name: Set up PATH
        run: echo "/opt/homebrew/bin:/usr/local/go/bin:$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Fyne
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build
        run: |
          cd go
          GOARCH=arm64 go build -buildmode=pie -ldflags="-s -w" -o tnt

      - name: Package
        run: |
          cd go
          fyne package -os darwin -name TNT -icon ../Icon.png -executable tnt --appID com.collinsgroup.tnt

      - name: Add FFmpeg to bundle
        run: |
          cp go/platform/ffmpegSource/ffmpegMacM go/TNT.app/Contents/MacOS/ffmpeg
          chmod +x go/TNT.app/Contents/MacOS/ffmpeg

      - name: Import Certificate
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > signing-certificate.p12
          security delete-keychain temp.keychain 2>/dev/null || true
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security import signing-certificate.p12 -k temp.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions temp.keychain
          security list-keychains -d user -s temp.keychain $(security list-keychains -d user | tr -d '"')
          rm signing-certificate.p12

      - name: Sign App
        run: |
          cd go
          find TNT.app -print0 | xargs -0 xattr -c 2>/dev/null || true
          xattr -cr TNT.app 2>/dev/null || true
          codesign --force --deep --options runtime --sign "Developer ID Application: Collins Group oy (478AR6Y9JJ)" TNT.app
          codesign --verify --deep --strict --verbose=2 TNT.app

      - name: Determine filename
        id: filename
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG" =~ -(mac|win|linux|unix) ]]; then
            echo "dmg_name=TNT.dmg" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ -(alpha|beta|rc)\. ]]; then
            PREFIX=$(echo "$TAG" | sed -E 's/.*-(alpha|beta|rc)\..*/\1/')
            echo "dmg_name=${PREFIX}-TNT.dmg" >> $GITHUB_OUTPUT
          else
            echo "dmg_name=TNT.dmg" >> $GITHUB_OUTPUT
          fi

      - name: Create DMG
        run: |
          cd go
          npm install -g create-dmg
          create-dmg TNT.app --overwrite --dmg-title="TNT" || true
          for f in TNT*.dmg; do mv "$f" ${{ steps.filename.outputs.dmg_name }}; break; done
          [ -f ${{ steps.filename.outputs.dmg_name }} ] || hdiutil create -volname "TNT" -srcfolder TNT.app -ov -format UDZO ${{ steps.filename.outputs.dmg_name }}

      - name: Notarize DMG
        run: |
          cd go
          xcrun notarytool submit ${{ steps.filename.outputs.dmg_name }} \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}" \
            --wait
          xcrun stapler staple ${{ steps.filename.outputs.dmg_name }}

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-assets
          path: go/${{ steps.filename.outputs.dmg_name }}

      - name: Cleanup Keychain
        if: always()
        run: security delete-keychain temp.keychain 2>/dev/null || true

  build-mac-intel:
    runs-on: macos-15-intel
    if: "(!contains(github.ref, '-win') || contains(github.ref, '-unix')) && !contains(github.ref, '-linux') && !contains(github.ref, '-macm')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install Fyne
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build
        run: |
          cd go
          GOARCH=amd64 go build -buildmode=pie -ldflags="-s -w" -o tnt

      - name: Package
        run: |
          cd go
          fyne package -os darwin -name TNT -icon ../Icon.png -executable tnt --appID com.collinsgroup.tnt

      - name: Add FFmpeg to bundle
        run: |
          cp go/platform/ffmpegSource/ffmpegMacX86 go/TNT.app/Contents/MacOS/ffmpeg
          chmod +x go/TNT.app/Contents/MacOS/ffmpeg

      - name: Import Certificate
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
          security delete-keychain temp.keychain 2>/dev/null || true
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security import certificate.p12 -k temp.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions temp.keychain
          security list-keychains -d user -s temp.keychain $(security list-keychains -d user | tr -d '"')
          rm certificate.p12

      - name: Sign App
        run: |
          cd go
          find TNT.app -print0 | xargs -0 xattr -c 2>/dev/null || true
          xattr -cr TNT.app 2>/dev/null || true
          codesign --force --deep --options runtime --sign "Developer ID Application: Collins Group oy (478AR6Y9JJ)" TNT.app
          codesign --verify --deep --strict --verbose=2 TNT.app

      - name: Determine filename
        id: filename
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG" =~ -(mac|win|linux|unix) ]]; then
            echo "dmg_name=TNT-Intel.dmg" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ -(alpha|beta|rc)\. ]]; then
            PREFIX=$(echo "$TAG" | sed -E 's/.*-(alpha|beta|rc)\..*/\1/')
            echo "dmg_name=${PREFIX}-TNT-Intel.dmg" >> $GITHUB_OUTPUT
          else
            echo "dmg_name=TNT-Intel.dmg" >> $GITHUB_OUTPUT
          fi

      - name: Create DMG
        run: |
          cd go
          npm install -g create-dmg
          create-dmg TNT.app --overwrite --dmg-title="TNT" || true
          for f in TNT*.dmg; do mv "$f" ${{ steps.filename.outputs.dmg_name }}; break; done
          [ -f ${{ steps.filename.outputs.dmg_name }} ] || hdiutil create -volname "TNT" -srcfolder TNT.app -ov -format UDZO ${{ steps.filename.outputs.dmg_name }}

      - name: Notarize DMG
        run: |
          cd go
          xcrun notarytool submit ${{ steps.filename.outputs.dmg_name }} \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}" \
            --wait
          xcrun stapler staple ${{ steps.filename.outputs.dmg_name }}

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-release-assets
          path: go/${{ steps.filename.outputs.dmg_name }}

      - name: Cleanup Keychain
        if: always()
        run: security delete-keychain temp.keychain 2>/dev/null || true

  build-windows:
    if: "!contains(github.ref, '-mac') && !contains(github.ref, '-linux') && !contains(github.ref, '-unix')"
    runs-on: [self-hosted, X64, Windows, Large]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

        # Go setup is not relevant for the local runners.

      #- name: Set up Go
      #  uses: actions/setup-go@v4
      #  with:
      #    go-version: '1.23'

      #- name: Install Fyne CLI
      #  run: go install fyne.io/fyne/v2/cmd/fyne@latest

      # No need to check for downloaded FFmpeg since it's not downloaded
      #- name: Verify FFmpeg exists
      #  run: |
      #    if (Test-Path go\platform\ffmpegSource\ffmpeg.exe) {
      #      Write-Host "FFmpeg found, size: $((Get-Item go\platform\ffmpegSource\ffmpeg.exe).Length) bytes"
      #    } else {
      #      Write-Host "ERROR: FFmpeg not found!"
      #      exit 1
      #    }
      #  shell: pwsh

      - name: Refresh PATH from registry
        run: |
          $machinePath = [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          $userPath    = [System.Environment]::GetEnvironmentVariable("PATH", "User")
          $currentPath = $env:PATH
          ($machinePath + ";" + $userPath).Split(";") |
            Where-Object { $_ -and $currentPath -notlike "*$_*" } |
            ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          Write-Host "PATH refreshed from registry"
        shell: powershell

      - name: Build Windows executable
        run: |
          $TAG = $env:GITHUB_REF -replace "refs/tags/v", ""
          $VERSION = $TAG.Split("-")[0]
          $env:CGO_ENABLED = "1"
          $env:GOARCH = "amd64"
          cd go
          go build -ldflags "-s -w -X main.version=$VERSION" -o TNT.exe
        shell: powershell

      - name: Create InnoSetup installer
        run: |
          New-Item -ItemType Directory -Force -Path packaging
          Copy-Item -Path go\TNT.exe -Destination packaging\tnt.exe
          Copy-Item -Path go\platform\ffmpegSource\ffmpeg.exe -Destination packaging\ffmpeg.exe
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 5\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found - install Inno Setup on this runner"; exit 1 }
          & $iscc packaging/inno_setup.iss
        shell: powershell

      - name: Determine filename
        id: filename
        run: |
          $TAG = "${{ github.ref }}".Replace("refs/tags/v", "")
          if ($TAG -match "-") {
            $PREFIX = $TAG.Split("-")[1].Split(".")[0]
            echo "exe_name=${PREFIX}-TNT.exe" >> $env:GITHUB_OUTPUT
          } else {
            echo "exe_name=TNT.exe" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Rename for distribution
        run: |
          Move-Item -Path Distribution\TNT.exe -Destination "Distribution\${{ steps.filename.outputs.exe_name }}"
        shell: powershell

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: Distribution/${{ steps.filename.outputs.exe_name }}

  build-linux:
    if: "(!contains(github.ref, '-win') || contains(github.ref, '-unix')) && !contains(github.ref, '-mac')"
    runs-on: [self-hosted, X64, Linux, Large]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

        # Go setup is not relevant for the local runners.

      #- name: Set up Go
      #  uses: actions/setup-go@v4
      #  with:
      #    go-version: '1.23'

      - name: Set up PATH
        run: echo "/usr/local/go/bin:$HOME/go/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libfuse2

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build Linux binary
        run: |
          cd go
          go build -tags linux -o ../tnt-linux-amd64

      - name: Determine version and prefix
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(echo "$TAG" | cut -d'-' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          if [[ "$TAG" =~ -(mac|win|linux|unix) ]]; then
            echo "prefix=" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-"* ]]; then
            PREFIX=$(echo "$TAG" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "prefix=${PREFIX}-" >> $GITHUB_OUTPUT
          else
            echo "prefix=" >> $GITHUB_OUTPUT
          fi

      - name: Create packaging files
        run: |
          cat > tnt.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Name=TNT
          Comment=Professional audio processing tool
          Exec=/usr/bin/tnt
          Icon=tnt
          Terminal=false
          Type=Application
          Categories=Audio;AudioVideo;
          DESKTOP_EOF

          mkdir -p staging/usr/bin staging/usr/share/applications staging/usr/share/icons/hicolor/256x256/apps
          cp tnt-linux-amd64 staging/usr/bin/tnt
          chmod +x staging/usr/bin/tnt
          cp go/platform/ffmpegSource/ffmpegLinuxAmd64 staging/usr/bin/ffmpeg
          chmod +x staging/usr/bin/ffmpeg
          cp tnt.desktop staging/usr/share/applications/
          cp Icon.png staging/usr/share/icons/hicolor/256x256/apps/tnt.png

          # nfpm config
          cat > nfpm.yaml << NFPM_EOF
          name: tnt
          arch: amd64
          version: ${{ steps.meta.outputs.version }}
          maintainer: Collins Group <appsupport@collinsgroup.fi>
          description: TNT Plus - Professional audio processing tool. Audio normalization and transcoding built for broadcast professionals.
          homepage: https://fremen.fi/software/tnt
          license: Proprietary
          section: sound
          priority: optional
          contents:
            - src: staging/usr/bin/tnt
              dst: /usr/bin/tnt
              file_info:
                mode: 0755
            - src: staging/usr/share/applications/tnt.desktop
              dst: /usr/share/applications/tnt.desktop
            - src: staging/usr/share/icons/hicolor/256x256/apps/tnt.png
              dst: /usr/share/icons/hicolor/256x256/apps/tnt.png
            - src: staging/usr/bin/ffmpeg
              dst: /usr/bin/ffmpeg
              file_info:
                mode: 0755
          scripts:
            postinstall: postinst
          NFPM_EOF

          cat > postinst << 'POSTINST_EOF'
          #!/bin/bash
          chmod +x /usr/bin/tnt
          update-desktop-database 2>/dev/null || true
          gtk-update-icon-cache /usr/share/icons/hicolor 2>/dev/null || true
          exit 0
          POSTINST_EOF
          chmod +x postinst

      - name: Build deb package (Debian/Ubuntu)
        run: |
          DEB_FILE="${{ steps.meta.outputs.prefix }}tnt_${{ steps.meta.outputs.version }}_amd64.deb"
          nfpm package -p deb -f nfpm.yaml --target "${DEB_FILE}"
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_ENV

      - name: Build rpm package (Fedora/RHEL/openSUSE)
        run: |
          RPM_FILE="${{ steps.meta.outputs.prefix }}tnt-${{ steps.meta.outputs.version }}-1.x86_64.rpm"
          nfpm package -p rpm -f nfpm.yaml --target "${RPM_FILE}"
          echo "RPM_FILE=${RPM_FILE}" >> $GITHUB_ENV

      - name: Build Arch package
        run: |
          ARCH_FILE="${{ steps.meta.outputs.prefix }}tnt-${{ steps.meta.outputs.version }}-1-x86_64.pkg.tar.zst"
          nfpm package -p archlinux -f nfpm.yaml --target "${ARCH_FILE}"
          echo "ARCH_FILE=${ARCH_FILE}" >> $GITHUB_ENV

      - name: Build AppImage
        run: |
          # Download appimagetool
          curl -Lo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # Build AppDir structure
          mkdir -p TNT.AppDir/usr/bin TNT.AppDir/usr/share/applications TNT.AppDir/usr/share/icons/hicolor/256x256/apps
          cp tnt-linux-amd64 TNT.AppDir/usr/bin/tnt
          chmod +x TNT.AppDir/usr/bin/tnt
          cp go/platform/ffmpegSource/ffmpegLinuxAmd64 TNT.AppDir/usr/bin/ffmpeg
          chmod +x TNT.AppDir/usr/bin/ffmpeg
          cp tnt.desktop TNT.AppDir/
          cp Icon.png TNT.AppDir/tnt.png
          cp Icon.png TNT.AppDir/usr/share/icons/hicolor/256x256/apps/tnt.png
          cp tnt.desktop TNT.AppDir/usr/share/applications/

          # AppRun entry point
          cat > TNT.AppDir/AppRun << 'APPRUN_EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/tnt" "$@"
          APPRUN_EOF
          chmod +x TNT.AppDir/AppRun

          APPIMAGE_FILE="${{ steps.meta.outputs.prefix }}TNT-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool TNT.AppDir "${APPIMAGE_FILE}"
          echo "APPIMAGE_FILE=${APPIMAGE_FILE}" >> $GITHUB_ENV

      - name: Build tarball
        run: |
          TAR_DIR="tnt-${{ steps.meta.outputs.version }}-linux-amd64"
          mkdir -p "${TAR_DIR}"
          cp tnt-linux-amd64 "${TAR_DIR}/tnt"
          chmod +x "${TAR_DIR}/tnt"
          cp go/platform/ffmpegSource/ffmpegLinuxAmd64 "${TAR_DIR}/ffmpeg"
          chmod +x "${TAR_DIR}/ffmpeg"
          cp tnt.desktop "${TAR_DIR}/"
          cp Icon.png "${TAR_DIR}/tnt.png"

          cat > "${TAR_DIR}/install.sh" << 'INSTALL_EOF'
          #!/bin/bash
          set -e
          echo "Installing TNT..."
          sudo cp tnt /usr/bin/tnt
          sudo chmod +x /usr/bin/tnt
          sudo cp tnt.desktop /usr/share/applications/ 2>/dev/null || true
          sudo mkdir -p /usr/share/icons/hicolor/256x256/apps
          sudo cp tnt.png /usr/share/icons/hicolor/256x256/apps/tnt.png 2>/dev/null || true
          echo "Done. Run 'tnt' to launch."
          INSTALL_EOF
          chmod +x "${TAR_DIR}/install.sh"

          TAR_FILE="${{ steps.meta.outputs.prefix }}tnt-${{ steps.meta.outputs.version }}-linux-amd64.tar.gz"
          tar czf "${TAR_FILE}" "${TAR_DIR}"
          echo "TAR_FILE=${TAR_FILE}" >> $GITHUB_ENV

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            ${{ env.DEB_FILE }}
            ${{ env.RPM_FILE }}
            ${{ env.ARCH_FILE }}
            ${{ env.APPIMAGE_FILE }}
            ${{ env.TAR_FILE }}

  release:
    needs:
      - build-linux
      - build-windows
      - build-mac-intel
      - build-mac-arm64
    if: always() && !failure() && !cancelled()

    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mac-release-assets/*.dmg
            mac-intel-release-assets/*.dmg
            linux-release-assets/*.deb
            linux-release-assets/*.rpm
            linux-release-assets/*.pkg.tar.zst
            linux-release-assets/*.AppImage
            linux-release-assets/*.tar.gz
            windows-release-assets/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
