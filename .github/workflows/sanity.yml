name: Sanity Check

on:
  pull_request:
  workflow_call:

jobs:
  sanity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run 'gofmt -w ./go' to fix:"
            echo "$unformatted"
            exit 1
          fi

      - name: Type check
        run: go vet ./...

      - name: Type check frontend JS
        run: npx -y -p typescript@5 tsc --noEmit -p frontend/jsconfig.json

      - name: Unit tests
        run: go test ./...

      - name: FFmpeg E2E smoke test
        run: go test -tags e2e -timeout 60s ./internal/ffmpeg/...

      - name: CLI daemon E2E smoke test
        run: go test -tags e2e -timeout 180s -run TestCLIDaemonProducesOutput .

      - name: Verify bundled FFmpeg binaries have required codecs
        working-directory: .
        run: |
          set -euo pipefail
          required=(
            --enable-nonfree
            --enable-gpl
            --enable-libfdk-aac
            --enable-libmp3lame
            --enable-libopus
            --enable-libsoxr
          )
          fail=0
          for bin in go/platform/ffmpegSource/*; do
            cfg=$(strings "$bin" | grep -m1 -- '--enable-libfdk-aac' || true)
            if [ -z "$cfg" ]; then
              echo "::error file=$bin::no configure string found — wrong/corrupt binary?"
              fail=1
              continue
            fi
            for flag in "${required[@]}"; do
              if ! grep -q -- "$flag" <<<"$cfg"; then
                echo "::error file=$bin::missing $flag"
                fail=1
              fi
            done
          done
          exit $fail

  build-mac-arm64:
    needs: sanity
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up PATH
        run: echo "/opt/homebrew/bin:/usr/local/go/bin:$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        run: |
          cd go
          wails build -platform darwin/arm64 -devtools -ldflags "-s -w -X main.version=pr-${{ github.event.pull_request.number }}"

      - name: Add FFmpeg to bundle
        run: |
          cp go/platform/ffmpegSource/ffmpegMacM go/build/bin/TNT.app/Contents/MacOS/ffmpeg
          chmod +x go/build/bin/TNT.app/Contents/MacOS/ffmpeg

      # Ad-hoc sign so reviewers can open the .app locally without Gatekeeper
      # blocking it. No notarization — that would need release secrets.
      - name: Ad-hoc sign
        run: |
          cd go/build/bin
          find TNT.app -print0 | xargs -0 xattr -c 2>/dev/null || true
          xattr -cr TNT.app 2>/dev/null || true
          codesign -f -s - --deep TNT.app
          codesign --verify --deep --strict --verbose=2 TNT.app

      # Smoke-test the actual shipping binary: drop a synthetic WAV in a watch
      # dir, run TNT in CLI daemon mode against the in-bundle ffmpeg, and
      # confirm an output file appears. Verifies *something* runnable shipped —
      # not audio substance.
      - name: CLI smoke test (shipping binary)
        run: |
          set -euo pipefail
          cd go/build/bin
          BUNDLE_FFMPEG="$PWD/TNT.app/Contents/MacOS/ffmpeg"
          BUNDLE_BIN="$PWD/TNT.app/Contents/MacOS/TNT"
          SMOKE="$RUNNER_TEMP/cli-smoke"
          mkdir -p "$SMOKE/in" "$SMOKE/out"
          "$BUNDLE_FFMPEG" -y -f lavfi -i anullsrc=r=8000:cl=mono -t 0.5 \
            -c:a pcm_s16le "$SMOKE/in/smoke.wav"
          "$BUNDLE_BIN" -i "$SMOKE/in" -o "$SMOKE/out" \
            -format pcm -bd 16 -sr 8000 \
            -lufs 0 -rg 0 -dyn-norm 0 -p:eq 0 -p:dyn 0 \
            -phase-check 0 -workers 1 &
          PID=$!
          for _ in $(seq 1 120); do
            if [ -s "$SMOKE/out/smoke.wav" ]; then break; fi
            sleep 0.5
          done
          kill -INT "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ ! -s "$SMOKE/out/smoke.wav" ]; then
            echo "::error::shipping binary produced no output"
            exit 1
          fi

      - name: Zip TNT.app
        run: |
          cd go/build/bin
          ditto -c -k --keepParent TNT.app TNT.app.zip

      - name: Upload PR macOS test build
        uses: actions/upload-artifact@v4
        with:
          name: tnt-pr-${{ github.event.pull_request.number }}-mac-arm64
          path: go/build/bin/TNT.app.zip

  build-windows:
    needs: sanity
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        shell: powershell
        run: |
          cd go
          wails build -platform windows/amd64 -devtools -ldflags "-s -w -X main.version=pr-${{ github.event.pull_request.number }}"

      - name: Bundle FFmpeg next to exe
        shell: powershell
        run: |
          Copy-Item -Path go\platform\ffmpegSource\ffmpeg.exe -Destination go\build\bin\ffmpeg.exe

      # Smoke-test the actual shipping exe: drop a synthetic WAV, run in CLI
      # daemon mode against the sidecar ffmpeg, confirm output appears. Does
      # not check audio substance — only that the shipping binary is runnable.
      - name: CLI smoke test (shipping binary)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "$PWD\go\build\bin"
          $smoke = "$env:RUNNER_TEMP\cli-smoke"
          New-Item -ItemType Directory -Force -Path "$smoke\in","$smoke\out" | Out-Null
          & "$bin\ffmpeg.exe" -y -f lavfi -i "anullsrc=r=8000:cl=mono" -t 0.5 `
            -c:a pcm_s16le "$smoke\in\smoke.wav"
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg fixture generation failed" }
          $proc = Start-Process -FilePath "$bin\TNT.exe" `
            -ArgumentList @('-i', "$smoke\in", '-o', "$smoke\out",
              '-format','pcm','-bd','16','-sr','8000',
              '-lufs','0','-rg','0','-dyn-norm','0',
              '-p:eq','0','-p:dyn','0','-phase-check','0','-workers','1') `
            -PassThru -WindowStyle Hidden
          $out = "$smoke\out\smoke.wav"
          $found = $false
          for ($i = 0; $i -lt 120; $i++) {
            if ((Test-Path $out) -and ((Get-Item $out).Length -gt 0)) { $found = $true; break }
            Start-Sleep -Milliseconds 500
          }
          # Windows lacks SIGINT semantics for non-console children spawned via
          # Start-Process; terminate the worker. We've already verified output.
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $found) { throw "shipping binary produced no output" }

      - name: Upload PR Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: tnt-pr-${{ github.event.pull_request.number }}-windows
          path: |
            go/build/bin/TNT.exe
            go/build/bin/ffmpeg.exe
