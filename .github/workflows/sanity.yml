name: Sanity Check

on:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format code
        run: |
          gofmt -w .
          if ! git diff --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply gofmt formatting"
            git push https://x-access-token:${{ secrets.FORMAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.head_ref }}
          fi

      - name: Type check
        run: go vet ./...
