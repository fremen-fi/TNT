name: Release Build

on:
  push:
      branches:
          - '*'

jobs:
  sanity:
    uses: ./.github/workflows/sanity.yml

      - name: Unit tests
        run: go test ./...

      - name: FFmpeg E2E smoke test
        run: go test -tags e2e -timeout 60s ./internal/ffmpeg/...

  build-mac-arm64:
    needs: sanity
    if: "(!contains(github.ref, '-win') || contains(github.ref, '-unix') || contains(github.ref, '-macm') || contains(github.ref, '-macs')) && !contains(github.ref, '-linux')"
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up PATH
        run: echo "/opt/homebrew/bin:/usr/local/go/bin:$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        run: |
          cd go
          wails build -platform darwin/arm64 -ldflags "-s -w"

      - name: Add FFmpeg to bundle
        run: |
          cp go/platform/ffmpegSource/ffmpegMacM go/build/bin/TNT.app/Contents/MacOS/ffmpeg
          chmod +x go/build/bin/TNT.app/Contents/MacOS/ffmpeg

      - name: Import Certificate
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > signing-certificate.p12
          security delete-keychain temp.keychain 2>/dev/null || true
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security import signing-certificate.p12 -k temp.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions temp.keychain
          security list-keychains -d user -s temp.keychain $(security list-keychains -d user | tr -d '"')
          rm signing-certificate.p12

      - name: Sign App
        run: |
          cd go/build/bin
          find TNT.app -print0 | xargs -0 xattr -c 2>/dev/null || true
          xattr -cr TNT.app 2>/dev/null || true

          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.network.client</key>
              <true/>
          </dict>
          </plist>
          EOF

          codesign --force --deep --options runtime --entitlements entitlements.plist \
            --sign "Developer ID Application: Collins Group oy (478AR6Y9JJ)" \
            TNT.app

          codesign --verify --deep --strict --verbose=2 TNT.app

      - name: Determine filename
        id: filename
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG" =~ -(mac|win|linux|unix) ]]; then
            echo "dmg_name=TNT.dmg" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ -(alpha|beta|rc)\. ]]; then
            PREFIX=$(echo "$TAG" | sed -E 's/.*-(alpha|beta|rc)\..*/\1/')
            echo "dmg_name=${PREFIX}-TNT.dmg" >> $GITHUB_OUTPUT
          else
            echo "dmg_name=TNT.dmg" >> $GITHUB_OUTPUT
          fi

      - name: Create DMG
        run: |
          cd go/build/bin
          npm install -g create-dmg
          create-dmg TNT.app --overwrite --dmg-title="TNT" || true
          for f in TNT*.dmg; do mv "$f" ${{ steps.filename.outputs.dmg_name }}; break; done
          [ -f ${{ steps.filename.outputs.dmg_name }} ] || hdiutil create -volname "TNT" -srcfolder TNT.app -ov -format UDZO ${{ steps.filename.outputs.dmg_name }}

      - name: Notarize DMG
        run: |
          cd go/build/bin
          xcrun notarytool submit ${{ steps.filename.outputs.dmg_name }} \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}" \
            --wait
          xcrun stapler staple ${{ steps.filename.outputs.dmg_name }}

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-assets
          path: go/build/bin/${{ steps.filename.outputs.dmg_name }}

      - name: Cleanup Keychain
        if: always()
        run: security delete-keychain temp.keychain 2>/dev/null || true


  build-windows:
    needs: sanity
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        shell: powershell
        run: |
          $TAG = ($env:GITHUB_REF -replace 'refs/heads/', '') -replace '/', '-'
          cd go
          wails build -platform windows/amd64 -ldflags "-s -w -X main.version=dev-$TAG"

      - name: Bundle FFmpeg next to exe
        shell: powershell
        run: |
          Copy-Item -Path go\platform\ffmpegSource\ffmpeg.exe -Destination go\build\bin\ffmpeg.exe

      - name: Upload Windows dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: tnt-dev-windows
          path: |
            go/build/bin/TNT.exe
            go/build/bin/ffmpeg.exe
